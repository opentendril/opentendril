name: Docker Build & Publish

# Invoked only by Publish Release. Not an independent production authority.
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Bind Docker publication identity
        id: bind
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          source_sha="${SOURCE_SHA:-}"
          if [ -z "${tag}" ]; then
            echo "published release identity is absent" >&2
            exit 1
          fi
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "published release identity ${tag} is not a stable vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          if [ -z "${source_sha}" ]; then
            echo "publication source SHA is absent" >&2
            exit 1
          fi
          if [[ ! "${source_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "publication source SHA is not a full commit: ${source_sha}" >&2
            exit 1
          fi
          source_sha="$(printf '%s' "${source_sha}" | tr 'A-F' 'a-f')"
          version="${tag#v}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "source-sha=${source_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout published release source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.bind.outputs.tag }}
          fetch-depth: 1

      - name: Require checked-out source matches publication SHA
        env:
          SOURCE_SHA: ${{ steps.bind.outputs.source-sha }}
        shell: bash
        run: |
          set -euo pipefail
          got="$(git rev-parse HEAD)"
          if [ "${got}" != "${SOURCE_SHA}" ]; then
            echo "checked-out HEAD ${got} does not match publication source ${SOURCE_SHA}" >&2
            exit 1
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.bind.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
