name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  bind:
    name: Bind publication source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.classify.outputs.source-sha }}
      version: ${{ steps.classify.outputs.version }}
      intended-tag: ${{ steps.classify.outputs.intended-tag }}
      state: ${{ steps.classify.outputs.state }}
    steps:
      - name: Require maintainer dispatch on main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Publish Release accepts only workflow_dispatch."
            exit 1
          fi
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Publish Release may operate only on main (got ${{ github.ref }})."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Bind source and classify publication
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${source_sha}"
          bash scripts/release-version.sh publication-state "${source_sha}" | tee -a "$GITHUB_OUTPUT"

  verify:
    name: Release verification
    needs: bind
    uses: ./.github/workflows/ci.yml
    with:
      force_full_verification: true
    permissions:
      contents: read

  publish:
    name: Publish
    needs: [bind, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bind.outputs.source-sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Keep in lockstep with ci.yml — never ship public release binaries
          # built with an end-of-life toolchain (EOL Go carries known stdlib CVEs).
          go-version: '1.26.x'

      - name: Recheck remote main and intended tag
        id: prebuild
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ needs.bind.outputs.source-sha }}"
          test "$(git rev-parse HEAD)" = "${source_sha}"
          version="$(bash scripts/release-version.sh current)"
          tag="$(bash scripts/release-version.sh intended-tag)"
          test "${version}" = "${{ needs.bind.outputs.version }}"
          test "${tag}" = "${{ needs.bind.outputs.intended-tag }}"
          bash scripts/release-version.sh publication-state "${source_sha}" | tee -a "$GITHUB_OUTPUT"

      # Each platform archive contains two independently built executables
      # from the root Go module:
      #   ./cmd/stem        -> tendril      (full Stem/operator executable)
      #   ./cmd/tendril-mcp -> tendril-mcp  (restricted governed Pollinator bridge)
      # They are not interchangeable and must not be copied or renamed into
      # each other. Archives contain only those two files — not the source
      # tree, scripts, Docker Compose files, or Greenhouse.
      #
      # install.sh is staged from the tracked first-party installer. Do not
      # generate or maintain a second installer implementation. The staged
      # bytes must match the tracked file. checksums.txt covers the four
      # archives and install.sh. GitHub Release remains the terminal public
      # distribution surface.
      - name: Build platform archives
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash scripts/release-version.sh current)"
          test "${version}" = "${{ needs.bind.outputs.version }}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            staging="dist/staging-${os}-${arch}"
            mkdir -p "${staging}"
            GOOS="${os}" GOARCH="${arch}" go build -ldflags="-s -w -X github.com/opentendril/opentendril/internal/buildinfo.Version=${version}" -o "${staging}/tendril" ./cmd/stem
            GOOS="${os}" GOARCH="${arch}" go build -ldflags="-s -w -X github.com/opentendril/opentendril/internal/buildinfo.Version=${version}" -o "${staging}/tendril-mcp" ./cmd/tendril-mcp
            tar -C "${staging}" -czf "dist/opentendril-${os}-${arch}.tar.gz" tendril tendril-mcp
            rm -rf "${staging}"
          done
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "${verify_dir}"' EXIT
          go build -ldflags="-s -w -X github.com/opentendril/opentendril/internal/buildinfo.Version=${version}" -o "${verify_dir}/tendril" ./cmd/stem
          go build -ldflags="-s -w -X github.com/opentendril/opentendril/internal/buildinfo.Version=${version}" -o "${verify_dir}/tendril-mcp" ./cmd/tendril-mcp
          test "$("${verify_dir}/tendril" --version)" = "tendril ${version}"
          test "$("${verify_dir}/tendril-mcp" --version)" = "tendril-mcp ${version}"
          echo "Verified release binaries: tendril ${version}; tendril-mcp ${version}"
          want="$(printf '%s\n' tendril tendril-mcp)"
          for archive in \
            opentendril-linux-amd64.tar.gz \
            opentendril-linux-arm64.tar.gz \
            opentendril-darwin-amd64.tar.gz \
            opentendril-darwin-arm64.tar.gz
          do
            test -f "dist/${archive}"
            got="$(tar -tzf "dist/${archive}" | sed '/\/$/d' | sort)"
            if [ "${got}" != "${want}" ]; then
              echo "archive ${archive} contents are not exactly tendril and tendril-mcp:"
              printf '%s\n' "${got}"
              exit 1
            fi
          done
          test -f install.sh
          cp install.sh dist/install.sh
          if ! cmp -s install.sh dist/install.sh; then
            echo "staged dist/install.sh is not byte-identical to tracked install.sh"
            exit 1
          fi
          (
            cd dist
            sha256sum \
              opentendril-linux-amd64.tar.gz \
              opentendril-linux-arm64.tar.gz \
              opentendril-darwin-amd64.tar.gz \
              opentendril-darwin-arm64.tar.gz \
              install.sh \
              > checksums.txt
          )
          if ! cmp -s install.sh dist/install.sh; then
            echo "checksum generation mutated staged install.sh"
            exit 1
          fi
          want_assets="$(printf '%s\n' \
            checksums.txt \
            install.sh \
            opentendril-darwin-amd64.tar.gz \
            opentendril-darwin-arm64.tar.gz \
            opentendril-linux-amd64.tar.gz \
            opentendril-linux-arm64.tar.gz)"
          got_assets="$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          if [ "${got_assets}" != "${want_assets}" ]; then
            echo "release staging does not contain exactly the intended assets:"
            printf '%s\n' "${got_assets}"
            exit 1
          fi
          want_checksums="$(printf '%s\n' \
            install.sh \
            opentendril-darwin-amd64.tar.gz \
            opentendril-darwin-arm64.tar.gz \
            opentendril-linux-amd64.tar.gz \
            opentendril-linux-arm64.tar.gz)"
          checksum_lines="$(wc -l < dist/checksums.txt | tr -d '[:space:]')"
          if [ "${checksum_lines}" != "5" ]; then
            echo "checksums.txt must contain exactly 5 SHA-256 entries (got ${checksum_lines}):"
            cat dist/checksums.txt
            exit 1
          fi
          if grep -Ev '^[0-9a-f]{64}  (opentendril-(linux|darwin)-(amd64|arm64)\.tar\.gz|install\.sh)$' dist/checksums.txt | grep -q .; then
            echo "checksums.txt contains a line that is not a SHA-256 entry for an intended asset:"
            cat dist/checksums.txt
            exit 1
          fi
          got_checksums="$(awk '{print $2}' dist/checksums.txt | sort)"
          if [ "${got_checksums}" != "${want_checksums}" ]; then
            echo "checksums.txt does not name exactly the intended assets:"
            cat dist/checksums.txt
            exit 1
          fi
          (
            cd dist
            sha256sum -c checksums.txt
          )
          # Publication uses the files: list, not "everything in dist/".
          # Fail closed if Create Release inputs drift from the staged set.
          for asset in \
            opentendril-linux-amd64.tar.gz \
            opentendril-linux-arm64.tar.gz \
            opentendril-darwin-amd64.tar.gz \
            opentendril-darwin-arm64.tar.gz \
            install.sh \
            checksums.txt
          do
            if ! grep -q "^            dist/${asset}$" .github/workflows/release.yml; then
              echo "Create Release files: list is missing dist/${asset}"
              exit 1
            fi
          done
          publish_count="$(grep -c '^            dist/' .github/workflows/release.yml || true)"
          if [ "${publish_count}" != "6" ]; then
            echo "Create Release files: list must name exactly 6 dist/ assets (got ${publish_count})"
            grep -n '^            dist/' .github/workflows/release.yml || true
            exit 1
          fi

      - name: Recheck remote main and intended tag before public mutation
        id: pretag
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ needs.bind.outputs.source-sha }}"
          bash scripts/release-version.sh publication-state "${source_sha}" | tee -a "$GITHUB_OUTPUT"

      - name: Create annotated tag when absent
        if: ${{ steps.pretag.outputs.state == 'first-publication' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.bind.outputs.intended-tag }}"
          source_sha="${{ needs.bind.outputs.source-sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${source_sha}" -m "OpenTendril ${tag}"
          git push origin "refs/tags/${tag}"

      - name: Require intended tag at the publication source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ needs.bind.outputs.source-sha }}"
          state="$(bash scripts/release-version.sh publication-state "${source_sha}" | sed -n 's/^state=//p')"
          if [ "${state}" != "safe-retry" ]; then
            echo "refusing GitHub Release until intended tag exists at ${source_sha} (state=${state:-<empty>})."
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bind.outputs.intended-tag }}
          target_commitish: ${{ needs.bind.outputs.source-sha }}
          name: OpenTendril ${{ needs.bind.outputs.intended-tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/opentendril-linux-amd64.tar.gz
            dist/opentendril-linux-arm64.tar.gz
            dist/opentendril-darwin-amd64.tar.gz
            dist/opentendril-darwin-arm64.tar.gz
            dist/install.sh
            dist/checksums.txt
          body: |
            ## OpenTendril ${{ needs.bind.outputs.intended-tag }}

            Self-hosted AI coding assistant. Point it at any project. Talk to it. It reads, edits, and commits.

            `install.sh` is the installation entrypoint. It is not the Stem and it is not the Pollinator bridge.

            Each platform archive contains two distinct executables:
            - `tendril` — the full Stem/operator executable
            - `tendril-mcp` — the restricted governed Pollinator bridge

            They are not interchangeable. A governed Pollinator uses `tendril-mcp`, not a copy of `tendril`.

            Verify `install.sh` and the downloaded archives against `checksums.txt` (SHA-256) before installing. The installation guide is `docs/GUIDE-INSTALL.md` in this repository; follow that document rather than improvising from this release text.

            ### Release assets
            | Asset | Purpose |
            |-------|---------|
            | `install.sh` | installation entrypoint |
            | `opentendril-linux-amd64.tar.gz` | Linux x86_64 (`tendril` and `tendril-mcp`) |
            | `opentendril-linux-arm64.tar.gz` | Linux ARM64 (`tendril` and `tendril-mcp`) |
            | `opentendril-darwin-amd64.tar.gz` | macOS Intel (`tendril` and `tendril-mcp`) |
            | `opentendril-darwin-arm64.tar.gz` | macOS Apple Silicon (`tendril` and `tendril-mcp`) |
            | `checksums.txt` | SHA-256 of `install.sh` and the four platform archives |
