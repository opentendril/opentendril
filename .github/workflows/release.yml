name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Keep in lockstep with ci.yml — never ship public release binaries
          # built with an end-of-life toolchain (EOL Go carries known stdlib CVEs).
          go-version: '1.26.x'

      # Each platform archive contains two independently built executables
      # from the root Go module:
      #   ./cmd/stem        -> tendril      (full Stem/operator executable)
      #   ./cmd/tendril-mcp -> tendril-mcp  (restricted Pollinator-side MCP bridge)
      # They are not interchangeable and must not be copied or renamed into
      # each other. Archives contain only those two files — not the source
      # tree, scripts, Docker Compose files, or Greenhouse.
      - name: Build platform archives
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            staging="dist/staging-${os}-${arch}"
            mkdir -p "${staging}"
            GOOS="${os}" GOARCH="${arch}" go build -ldflags="-s -w" -o "${staging}/tendril" ./cmd/stem
            GOOS="${os}" GOARCH="${arch}" go build -ldflags="-s -w" -o "${staging}/tendril-mcp" ./cmd/tendril-mcp
            tar -C "${staging}" -czf "dist/opentendril-${os}-${arch}.tar.gz" tendril tendril-mcp
            rm -rf "${staging}"
          done
          for archive in \
            opentendril-linux-amd64.tar.gz \
            opentendril-linux-arm64.tar.gz \
            opentendril-darwin-amd64.tar.gz \
            opentendril-darwin-arm64.tar.gz
          do
            test -f "dist/${archive}"
          done
          (
            cd dist
            sha256sum \
              opentendril-linux-amd64.tar.gz \
              opentendril-linux-arm64.tar.gz \
              opentendril-darwin-amd64.tar.gz \
              opentendril-darwin-arm64.tar.gz \
              > checksums.txt
          )

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/opentendril-linux-amd64.tar.gz
            dist/opentendril-linux-arm64.tar.gz
            dist/opentendril-darwin-amd64.tar.gz
            dist/opentendril-darwin-arm64.tar.gz
            dist/checksums.txt
          body: |
            ## OpenTendril ${{ github.ref_name }}

            Self-hosted AI coding assistant. Point it at any project. Talk to it. It reads, edits, and commits.

            Install from the platform archive for your machine. The installation guide is `docs/GUIDE-INSTALL.md` in this repository; follow that document rather than improvising from this release text.

            Each archive contains two distinct executables:
            - `tendril` — the full Stem/operator executable
            - `tendril-mcp` — the restricted Pollinator-side MCP bridge

            They are not interchangeable. A governed Pollinator uses `tendril-mcp`, not a copy of `tendril`.

            Verify downloaded archives against `checksums.txt` (SHA-256) before installing.

            ### Archives
            | Platform | Archive |
            |----------|---------|
            | Linux x86_64 | `opentendril-linux-amd64.tar.gz` |
            | Linux ARM64 | `opentendril-linux-arm64.tar.gz` |
            | macOS Intel | `opentendril-darwin-amd64.tar.gz` |
            | macOS Apple Silicon | `opentendril-darwin-arm64.tar.gz` |
